<nav class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/80 backdrop-blur">
  <div class="container-shell flex items-center justify-between py-4">
    <a class="flex items-center gap-3 text-white" routerLink="/">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-2xl bg-brand-500/10 text-lg font-semibold text-brand-200"
      >
        R
      </span>
      <div>
        <p class="text-lg font-semibold tracking-tight">Rentify</p>
        <p class="text-xs text-slate-400">Premium car rental</p>
      </div>
    </a>

    <div class="hidden items-center gap-8 lg:flex">
      <a
        *ngFor="let link of links"
        [routerLink]="link.path"
        routerLinkActive="text-white"
        class="text-sm font-medium text-slate-300 transition hover:text-white"
      >
        {{ link.label }}
      </a>
    </div>

    <div class="hidden items-center gap-3 lg:flex">
      <button class="btn-secondary">Iniciar sesión</button>
      <a class="btn-primary" routerLink="/booking">Reservar ahora</a>
    </div>

    <button
      type="button"
      class="rounded-xl border border-white/10 bg-white/5 p-2 text-slate-200 transition hover:bg-white/10 lg:hidden"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <svg
        *ngIf="!menuOpen()"
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg
        *ngIf="menuOpen()"
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="border-t border-white/10 bg-slate-950/95 px-4 py-4 lg:hidden" *ngIf="menuOpen()">
    <div class="flex flex-col gap-3">
      <a
        *ngFor="let link of links"
        [routerLink]="link.path"
        routerLinkActive="text-white"
        class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-medium text-slate-200"
        (click)="toggleMenu()"
      >
        {{ link.label }}
      </a>
    </div>
    <div class="mt-4 flex flex-col gap-3">
      <button class="btn-secondary">Iniciar sesión</button>
      <a class="btn-primary" routerLink="/booking">Reservar ahora</a>
    </div>
  </div>
</nav>
